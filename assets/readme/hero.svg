<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">xrskill — 判断目标、解除卡点、拆出下一步</title>
  <desc id="desc">三个 Agent Skills 分别提供目标拆解、行动导航和心理卡点支持。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <path d="M0 322 C220 260 350 375 570 315 S910 245 1200 315 V400 H0Z" fill="#0f1b2d"/>

  <g transform="translate(60 50)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="0" y="24" font-size="18" fill="#7dd3fc" letter-spacing="2">AGENT SKILLS · ACTION RECOVERY SYSTEM</text>
    <text x="0" y="100" font-size="70" font-weight="750" fill="#f8fafc">xrskill</text>
    <text x="0" y="147" font-size="25" fill="#cbd5e1">判断目标，解除卡点，拆出下一步</text>
    <text x="0" y="190" font-size="20" fill="#94a3b8">目标、方向和心理阻力，需要不同的行动工具。</text>

    <g transform="translate(0 232)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">
      <rect width="220" height="46" rx="10" fill="#172554" stroke="#60a5fa"/>
      <text x="110" y="30" text-anchor="middle" fill="#bfdbfe">/xr-trauma-support</text>
      <rect x="236" width="220" height="46" rx="10" fill="#12302d" stroke="#34d399"/>
      <text x="346" y="30" text-anchor="middle" fill="#a7f3d0">/xr-survive-game</text>
      <rect x="472" width="150" height="46" rx="10" fill="#3b2611" stroke="#fbbf24"/>
      <text x="547" y="30" text-anchor="middle" fill="#fde68a">/xr-goal</text>
    </g>
  </g>

  <g transform="translate(760 55)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <path d="M38 45 V275" stroke="#334155" stroke-width="3"/>
    <g transform="translate(0 0)">
      <circle cx="38" cy="45" r="17" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
      <rect x="78" y="12" width="290" height="68" rx="14" fill="#111c32" stroke="#334155"/>
      <text x="101" y="39" font-size="21" font-weight="650" fill="#bfdbfe">心理支持</text>
      <text x="101" y="64" font-size="18" fill="#94a3b8">看见恐惧与旧信念</text>
    </g>
    <g transform="translate(0 100)">
      <circle cx="38" cy="45" r="17" fill="#12302d" stroke="#34d399" stroke-width="3"/>
      <rect x="78" y="12" width="290" height="68" rx="14" fill="#10231f" stroke="#334155"/>
      <text x="101" y="39" font-size="21" font-weight="650" fill="#a7f3d0">行动导航</text>
      <text x="101" y="64" font-size="18" fill="#94a3b8">判断价值，恢复启动</text>
    </g>
    <g transform="translate(0 200)">
      <circle cx="38" cy="45" r="17" fill="#3b2611" stroke="#fbbf24" stroke-width="3"/>
      <rect x="78" y="12" width="290" height="68" rx="14" fill="#2b1d0f" stroke="#334155"/>
      <text x="101" y="39" font-size="21" font-weight="650" fill="#fde68a">目标拆解</text>
      <text x="101" y="64" font-size="18" fill="#94a3b8">条件树、瓶颈、验证</text>
    </g>
  </g>
</svg>
