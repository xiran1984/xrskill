<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">xrskill 按瓶颈路由三个技能</title>
  <desc id="desc">根据用户缺少路径、方向不清或受到心理阻力，分别选择 xr-goal、xr-survive-game 或 xr-trauma-support。</desc>
  <rect width="1200" height="500" rx="28" fill="#0b1220"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="58" y="62" font-size="38" font-weight="700" fill="#f8fafc">先判断卡在哪里，再选择 Skill</text>
    <text x="58" y="98" font-size="20" fill="#94a3b8">三个模块不是固定疗程；相同的“不行动”，可能来自不同瓶颈。</text>

    <g transform="translate(58 165)">
      <rect width="245" height="96" rx="18" fill="#151f32" stroke="#475569"/>
      <text x="122" y="39" text-anchor="middle" font-size="19" fill="#94a3b8">共同入口</text>
      <text x="122" y="70" text-anchor="middle" font-size="24" font-weight="650" fill="#f8fafc">“我现在动不了”</text>
    </g>

    <path d="M315 213 H365" stroke="#64748b" stroke-width="3"/>
    <path d="M353 204 L367 213 L353 222" fill="none" stroke="#64748b" stroke-width="3"/>

    <g transform="translate(380 140)">
      <rect width="255" height="146" rx="18" fill="#111827" stroke="#475569"/>
      <text x="25" y="36" font-size="18" fill="#94a3b8">先区分瓶颈</text>
      <text x="25" y="71" font-size="21" fill="#e2e8f0">路径不清</text>
      <text x="25" y="103" font-size="21" fill="#e2e8f0">方向失真 / 低能量</text>
      <text x="25" y="135" font-size="21" fill="#e2e8f0">恐惧、羞耻、旧警报</text>
    </g>

    <path d="M647 178 H705" stroke="#fbbf24" stroke-width="3"/>
    <path d="M647 213 H705" stroke="#34d399" stroke-width="3"/>
    <path d="M647 248 H705" stroke="#60a5fa" stroke-width="3"/>

    <g transform="translate(720 125)">
      <rect width="420" height="78" rx="16" fill="#2b1d0f" stroke="#fbbf24" stroke-width="2"/>
      <text x="25" y="34" font-size="20" fill="#fcd34d">/xr-goal</text>
      <text x="25" y="61" font-size="20" fill="#e2e8f0">目标 → 条件树 → 瓶颈 → 验证标准</text>
    </g>
    <g transform="translate(720 215)">
      <rect width="420" height="78" rx="16" fill="#10231f" stroke="#34d399" stroke-width="2"/>
      <text x="25" y="34" font-size="20" fill="#6ee7b7">/xr-survive-game</text>
      <text x="25" y="61" font-size="20" fill="#e2e8f0">判断价值 → 选择方向 → 5分钟启动</text>
    </g>
    <g transform="translate(720 305)">
      <rect width="420" height="78" rx="16" fill="#111c32" stroke="#60a5fa" stroke-width="2"/>
      <text x="25" y="34" font-size="20" fill="#93c5fd">/xr-trauma-support</text>
      <text x="25" y="61" font-size="20" fill="#e2e8f0">识别 → 宽慰 → 安全恢复方向</text>
    </g>

    <g transform="translate(58 365)">
      <text x="0" y="24" font-size="21" fill="#cbd5e1">可选接力：</text>
      <text x="112" y="24" font-size="21" fill="#94a3b8">心理卡点缓解后交给 xr-goal；方向确认后也可交给 xr-goal。</text>
      <text x="0" y="66" font-size="19" fill="#64748b">任何路径都只输出对当前用户有用的最小下一步。</text>
    </g>
  </g>
</svg>
